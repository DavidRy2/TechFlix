<!DOCTYPE html> 
<html lang="pt-br" data-bs-theme="dark">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - WayneTech</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        /* Fundo igual às outras páginas */
        body {
            background: url('assets/img/fundo.jpg') no-repeat center/cover;
            height: 100vh;
            margin: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
        }

        body::before {
            content: "";
            position: absolute;
            inset: 0;
            background: rgba(0, 0, 0, 0.65);
            backdrop-filter: blur(3px);
            z-index: 0;
        }

        /* Caixa do login */
        .form-signin {
            width: 350px;
            z-index: 1;
            background: #1e1f26d9;
            border: 1px solid #2b2f35;
            border-radius: 15px;
        }

        .form-control {
            background: #2c2f38 !important;
            border: 1px solid #3a3d47;
            color: white;
        }

        .form-control:focus {
            border-color: #0dcaf0;
            box-shadow: 0 0 6px #0dcaf0;
        }

        /* Logo redondinha padrão WayneTech */
        .logo {
            width: 90px;
            height: 90px;
            object-fit: cover;
            border-radius: 50%;
            background: #ffffff22;
            padding: 5px;
        }

        .btn-primary {
            background: #0a3a78 !important;
            border: none;
        }

        .btn-primary:hover {
            background: #072c5a !important;
        }

        .btn-outline-info:hover {
            background: #0dcaf0 !important;
            color: #000 !important;
        }

        /* Modal estilizado */
        .modal-content {
            background: #1a1d23 !important;
        }

        .form-select {
            background: #2c2f38;
            border: 1px solid #3a414d;
            color: #fff;
        }
    </style>
</head>

<body>

    <main class="form-signin text-center shadow-lg p-5 rounded-4">
        
        <!-- FORMULÁRIO DE LOGIN -->
        <form action="sistema/login.php" method="POST">

            <img src="assets/img/LOGO3.jpeg"
                 alt="Logo WayneTech"
                 class="mb-4 logo shadow" />

            <h1 class="h3 mb-4 fw-bold text-info">WayneTech</h1>

            <div class="form-floating mb-3">
                <input type="email" class="form-control" name="email" id="email" placeholder="Seu email" required>
                <label for="email">Email</label>
            </div>

            <div class="form-floating mb-3">
                <input type="password" class="form-control" name="senha" id="senha" placeholder="Senha" required>
                <label for="senha">Senha</label>
            </div>

            <button type="submit" class="btn btn-primary w-100 py-2 mb-3 rounded-3">
                Entrar
            </button>

            <button type="button" 
                    class="btn btn-outline-info w-100 py-2 mb-4 rounded-3" 
                    data-bs-toggle="modal" 
                    data-bs-target="#cadastroModal">
                Criar conta
            </button>

            <p class="text-secondary small mb-0">
                © 2025 - David, Elaine, Gabriel, Joel, Tatiana.
            </p>

        </form>
    </main>

    <!-- MODAL DE CADASTRO -->
    <div class="modal fade" id="cadastroModal" tabindex="-1">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content border border-info shadow-lg">

                <div class="modal-header border-info">
                    <h5 class="modal-title text-info">Cadastro de Usuário</h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
                </div>

                <div class="modal-body">

                    <form action="sistema/cadastro.php" method="POST">

                        <div class="form-floating mb-3">
                            <input type="text" name="nome" class="form-control" id="cadNome" required>
                            <label for="cadNome">Nome completo</label>
                        </div>

                        <div class="form-floating mb-3">
                            <input type="email" name="email" class="form-control" id="cadEmail" required>
                            <label for="cadEmail">Email</label>
                        </div>

                        <div class="form-floating mb-3">
                            <input type="password" name="senha" class="form-control" id="cadSenha" required>
                            <label for="cadSenha">Senha</label>
                        </div>

                        <div class="form-floating mb-3">
                            <input type="password" name="confirmar" class="form-control" id="cadConfirmar" required>
                            <label for="cadConfirmar">Confirmar senha</label>
                        </div>

                        <div class="mb-3 text-start">
                            <label class="text-info mb-2">Tipo de usuário</label>
                            <select class="form-select" name="tipo" required>
                                <option value="cliente">Cliente</option>
                                <option value="adm">Administrador</option>
                            </select>
                        </div>

                        <button type="submit" class="btn btn-info w-100">
                            Cadastrar
                        </button>

                    </form>

                </div>

                <div class="modal-footer border-info">
                    <button type="button" class="btn btn-outline-light" data-bs-dismiss="modal">Fechar</button>
                </div>

            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
