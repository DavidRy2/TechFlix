<!DOCTYPE html> 
<html lang="pt-BR" data-bs-theme="dark">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - WayneTech</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            background: url('assets/img/fundo.jpg') no-repeat center/cover;
            height: 100vh;
            margin: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            font-family: "Segoe UI", Arial, sans-serif;
        }

        body::before {
            content: "";
            position: absolute;
            inset: 0;
            background: linear-gradient(
                rgba(0, 0, 0, 0.78),
                rgba(0, 0, 0, 0.85)
            );
            backdrop-filter: blur(4px);
            z-index: 0;
        }

        .form-signin {
            width: 380px;
            z-index: 1;
            background: rgba(18, 22, 30, 0.92);
            border-radius: 18px;
            padding: 50px 35px;
            border: 1px solid #0dcaf033;
            box-shadow:
                0 0 18px #0dcaf033,
                inset 0 0 18px #0dcaf011;
            transition: 0.3s ease;
        }

        .form-signin:hover {
            box-shadow:
                0 0 25px #0dcaf055,
                inset 0 0 22px #0dcaf033;
            transform: translateY(-3px);
        }

        .form-control {
            background: #232730 ;
            border: 1px solid #3a3d47;
            color: white;
            transition: 0.25s;
            border-radius: 10px;
        }

        .form-control:focus {
            border-color: #0dcaf0;
            box-shadow: 0 0 8px #0dcaf099;
            background: #1f242d ;
        }

        .logo {
            width: 100px;
            height: 100px;
            object-fit: cover;
            border-radius: 50%;
            background: #0dcaf022;
            padding: 5px;
            box-shadow: 0 0 15px #0dcaf055;
            transition: 0.3s;
        }

        .logo:hover {
            transform: scale(1.07);
            box-shadow: 0 0 20px #0dcaf0aa;
        }

        .btn-primary {
            background: linear-gradient(90deg, #084a8a, #0a3a78);
            border: none;
            border-radius: 10px;
            transition: 0.3s;
        }

        .btn-primary:hover {
            background: linear-gradient(90deg, #0a74c7, #0955a0) ;
            transform: scale(1.03);
        }

        .btn-outline-info {
            border-radius: 10px;
            border-width: 2px;
            transition: 0.25s;
        }

        .btn-outline-info:hover {
            background: #0dcaf0 ;
            color: #000 ;
            transform: scale(1.03);
        }

        .modal-content {
            background: #15181e ;
            border-radius: 15px;
            border: 1px solid #0dcaf055 ;
            box-shadow: 0 0 20px #0dcaf033;
        }

        .form-select {
            background: #232730;
            border: 1px solid #3a414d;
            color: white;
            border-radius: 10px;
        }

        h1.text-info {
            text-shadow:
                0 0 8px #0dcaf0,
                0 0 12px #0dcaf088;
        }
    </style>
</head>

<body>

    <main class="form-signin text-center shadow-lg p-5 rounded-4">
        
        <form action="sistema/login.php" method="POST">

            <img src="assets/img/LOGO3.jpeg" alt="Logo WayneTech" class="mb-4 logo shadow" />

            <h1 class="h3 mb-4 fw-bold text-info">WayneTech</h1>

            <div class="form-floating mb-3">
                <input type="email" class="form-control" name="email" id="email" placeholder="Seu email" required>
                <label for="email">Email</label>
            </div>

            <div class="form-floating mb-3">
                <input type="password" class="form-control" name="senha" id="senha" placeholder="Senha" required>
                <label for="senha">Senha</label>
            </div>

            <button type="submit" class="btn btn-primary w-100 py-2 mb-3 rounded-3">
                Entrar
            </button>

            <button type="button" 
                    class="btn btn-outline-info w-100 py-2 mb-4 rounded-3" 
                    data-bs-toggle="modal" 
                    data-bs-target="#cadastroModal">
                Criar conta
            </button>

            <p class="text-secondary small mb-0">
                © 2025 - David, Elaine, Gabriel, Joel, Tatiana.
            </p>

        </form>
    </main>

    <div class="modal fade" id="cadastroModal" tabindex="-1">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content border border-info shadow-lg">

                <div class="modal-header border-info">
                    <h5 class="modal-title text-info">Cadastro de Usuário</h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
                </div>

                <div class="modal-body">

                    <form action="sistema/cadastro.php" method="POST">

                        <div class="form-floating mb-3">
                            <input type="text" name="nome" class="form-control" id="cadNome" required>
                            <label for="cadNome">Nome completo</label>
                        </div>

                        <div class="form-floating mb-3">
                            <input type="email" name="email" class="form-control" id="cadEmail" required>
                            <label for="cadEmail">Email</label>
                        </div>

                        <div class="form-floating mb-3">
                            <input type="password" name="senha" class="form-control" id="cadSenha" required>
                            <label for="cadSenha">Senha</label>
                        </div>

                        <div class="form-floating mb-3">
                            <input type="password" name="confirmar" class="form-control" id="cadConfirmar" required>
                            <label for="cadConfirmar">Confirmar senha</label>
                        </div>

                        <div class="mb-3 text-start">
                            <label class="text-info mb-2">Tipo de usuário</label>
                            <select class="form-select" name="tipo" required>
                                <option value="cliente">Cliente</option>
                                <option value="adm">Administrador</option>
                            </select>
                        </div>

                        <button type="submit" class="btn btn-info w-100">
                            Cadastrar
                        </button>

                    </form>

                </div>

                <div class="modal-footer border-info">
                    <button type="button" class="btn btn-outline-light" data-bs-dismiss="modal">Fechar</button>
                </div>

            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
