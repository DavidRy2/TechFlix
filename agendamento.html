<!DOCTYPE html>
<html lang="pt-br" data-bs-theme="dark">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Agendar Atendimento - WayneTech</title>

    <!-- BOOTSTRAP -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        /* Fundo */
        body {
            background: url('fundo.jpg') no-repeat center/cover;
            min-height: 100vh;
            margin: 0;
            padding: 0;
            position: relative;
        }

        body::before {
            content: "";
            position: absolute;
            inset: 0;
            background: rgba(0, 0, 0, 0.65);
            backdrop-filter: blur(2px);
        }

        /* Card */
        .card-agendar {
            width: 100%;
            max-width: 420px;
            background: #2b313cd0;
            border-radius: 18px;
            border: 1px solid #3a414d;
            padding-bottom: 20px;
            box-shadow: 0 4px 30px rgba(0, 0, 0, 0.6);
            position: relative;
            z-index: 2;
            margin: 80px auto;
        }

        .card-header {
            background: #0a3a78;
            border-radius: 18px 18px 0 0;
            padding: 25px 10px;
            text-align: center;
        }

        .logo {
            width: 150px;
            filter: brightness(0) invert(1);
        }

        .form-control {
            background: #1f242dcc;
            border: 1px solid #3a414d;
            color: white;
            border-radius: 8px;
        }

        .form-control:focus {
            border-color: #0a3a78;
            box-shadow: 0 0 5px #0a3a78;
        }

        .btn-wayne {
            background: #0a3a78;
            border: none;
            color: white;
            border-radius: 8px;
            transition: 0.2s;
        }

        .btn-wayne:hover {
            background: #072c5a;
        }

        footer {
            padding: 25px 0;
            background: #111518;
            border-top: 1px solid #222831;
            position: relative;
            z-index: 2;
        }

        footer p {
            margin: 0;
        }
    </style>
</head>

<body>

    <!-- NAVBAR -->
    <!-- NAVBAR -->
<nav class="navbar navbar-expand-lg navbar-dark bg-dark shadow-sm position-relative" style="z-index: 3;">
    <div class="container">
        <a class="navbar-brand fw-bold fs-4" href="#">Wayne Tech</a>

        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
            <span class="navbar-toggler-icon"></span>
        </button>

        <div class="collapse navbar-collapse" id="navbarNav">

            <!-- ITENS CENTRALIZADOS -->
            <ul class="navbar-nav mx-auto">
                <li class="nav-item"><a href="home.html" class="nav-link">Início</a></li>
                <li class="nav-item"><a href="produtos.html" class="nav-link">Produtos</a></li>
                <li class="nav-item"><a href="agendamento.html" class="nav-link active">Agendamento</a></li>
            </ul>

            <form class="d-flex ms-3">
                <input class="form-control bg-dark text-white border-secondary" type="search" placeholder="Buscar...">
                <button class="btn btn-primary ms-2">Buscar</button>
            </form>

        </div>
    </div>
</nav>


    <!-- FORMULÁRIO -->
    <div class="card card-agendar">
        <div class="card-header">
            <img src="https://i.imgur.com/Z21xW0m.png" class="logo" alt="WayneTech">
        </div>

        <div class="card-body text-center">
            <h3 class="mb-4">Agendar Atendimento</h3>

            <form>
                <div class="mb-3">
                    <input type="text" class="form-control" placeholder="Nome" required>
                </div>

                <div class="mb-3">
                    <input type="email" class="form-control" placeholder="E-mail" required>
                </div>

                <div class="mb-3">
                    <textarea class="form-control" rows="4" placeholder="Mensagem" required></textarea>
                </div>

                <button type="submit" class="btn btn-wayne w-100 py-2">Agendar</button>
            </form>
        </div>
    </div>

    <!-- FOOTER -->
    <footer class="text-center text-light">
        <p>© 2025 Wayne Tech — Todos os direitos reservados</p>
        <a href="#" class="text-primary text-decoration-none">Voltar ao topo</a>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

</body>

</html>
