<!DOCTYPE html>
<html lang="pt-br" data-bs-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Agendar Atendimento - WayneTech</title>

    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        
        body {
            background: url('fundo.jpg') no-repeat center center/cover;
            min-height: 100vh;
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            position: relative;
        }

       
        body::before {
            content: "";
            position: absolute;
            inset: 0;
            background: rgba(0,0,0,0.65); 
            backdrop-filter: blur(2px);   
            z-index: 0;
        }

        
        .card-agendar {
            width: 100%;
            max-width: 380px;
            background: #2b313ccf; 
            backdrop-filter: blur(4px);
            border-radius: 18px;
            border: 1px solid #3a414d;
            box-shadow: 0 4px 25px rgba(0,0,0,0.5);
            position: relative;
            z-index: 1;
        }

        
        .card-header {
            background: #0a3a78;
            border-radius: 18px 18px 0 0 !important;
            padding: 25px 10px;
            text-align: center;
        }

        .logo {
            width: 150px;
            filter: brightness(0) invert(1);
        }

        
        .form-control {
            background: #1f242dcc;
            border: 1px solid #3a414d;
            color: white;
            border-radius: 8px;
        }

        .form-control:focus {
            border-color: #0a3a78;
            box-shadow: 0 0 5px #0a3a78;
        }

        
        .btn-wayne {
            background: #0a3a78;
            color: white;
            border-radius: 8px;
            border: 1px solid #0a3a78;
        }

        .btn-wayne:hover {
            background: #072c5a;
        }
    </style>
</head>

<body>

    <div class="card card-agendar">

        <div class="card-header">
            <img src="/mnt/data/708dc581-fd07-4a06-a0e5-1ef974c9a8a0.png" class="logo" alt="WayneTech">
        </div>

        <div class="card-body text-center">
            <h3 class="mb-4">Agendar Atendimento</h3>

            <form>
                <div class="mb-3">
                    <input type="text" class="form-control" placeholder="Nome" required>
                </div>

                <div class="mb-3">
                    <input type="email" class="form-control" placeholder="E-mail" required>
                </div>

                <div class="mb-3">
                    <textarea class="form-control" rows="4" placeholder="Mensagem" required></textarea>
                </div>

                <button type="submit" class="btn btn-wayne w-100 py-2">Agendar</button>
            </form>
        </div>

    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
