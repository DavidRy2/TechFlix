<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Wayne Tech</title>
<style>
    
    body {
        margin: 0;
        overflow: hidden;
        background: #0a0a0a;
        font-family: Arial, sans-serif;
    }

    canvas {
        position: fixed;
        top: 0;
        left: 0;
        z-index: -1;
    }

 
    h1 {
        text-align: center;
        margin-top: 40px;
        color: aqua;
        font-size: 38px;
        font-family: "Orbitron", sans-serif;
        letter-spacing: 3px;
        text-shadow: 0 0 10px aqua;
    }

    
    #logo-circle {
        width: 180px;
        height: 180px;
        border-radius: 50%;
        cursor: pointer;
        background-image: url('LOGO3.jpeg'); /* SUA LOGO */
        background-size: cover;
        background-position: center;
        background-repeat: no-repeat;

        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);

        box-shadow: 0 0 25px aqua, inset 0 0 15px #00ffff60;
        transition: transform 0.3s ease;
    }

    #logo-circle:hover {
        transform: translate(-50%, -50%) scale(1.05);
        box-shadow: 0 0 40px aqua, inset 0 0 20px #00ffff90;
    }
</style>
</head>
<body>

<h1> BEM VINDO AO WAYNE TECH!</h1>

<canvas id="particles"></canvas>

<div id="logo-circle"></div>

<script>

const circle = document.getElementById("logo-circle");
let escapeCount = 0;
const maxEscapes = 5;

function randomPosition() {
    let x = Math.random() * (window.innerWidth - 200);
    let y = Math.random() * (window.innerHeight - 200);
    return { x, y };
}

circle.addEventListener("mouseover", () => {
    if (escapeCount < maxEscapes) {
        const pos = randomPosition();
        circle.style.transition = "0.3s ease";
        circle.style.left = pos.x + "px";
        circle.style.top = pos.y + "px";
        escapeCount++;
    } else {
        
        circle.style.left = "50%";
        circle.style.top = "50%";
        circle.style.transform = "translate(-50%, -50%)";
        circle.style.pointerEvents = "auto";
    }
});

circle.addEventListener("click", () => {
    window.location.href = "index.html";
});



const canvas = document.getElementById("particles");
const ctx = canvas.getContext("2d");

canvas.width = window.innerWidth;
canvas.height = window.innerHeight;

let particlesArray = [];

class Particle {
    constructor() {
        this.x = Math.random() * canvas.width;
        this.y = Math.random() * canvas.height;
        this.size = Math.random() * 3 + 1;
        this.speedX = (Math.random() - 0.5) * 1;
        this.speedY = (Math.random() - 0.5) * 1;
        this.color = "rgba(0,255,255,0.7)";
    }

    update() {
        this.x += this.speedX;
        this.y += this.speedY;

        if (this.size > 0.2) {
            this.size -= 0.01;
        }

        if (this.size <= 0.2) {
            this.x = Math.random() * canvas.width;
            this.y = Math.random() * canvas.height;
            this.size = Math.random() * 3 + 1;
        }
    }

    draw() {
        ctx.beginPath();
        ctx.fillStyle = this.color;
        ctx.shadowColor = "aqua";
        ctx.shadowBlur = 15;
        ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
        ctx.fill();
        ctx.closePath();
    }
}

function initParticles() {
    particlesArray = [];
    for (let i = 0; i < 200; i++) {
        particlesArray.push(new Particle());
    }
}

function animateParticles() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    particlesArray.forEach(p => {
        p.update();
        p.draw();
    });
    requestAnimationFrame(animateParticles);
}

initParticles();
animateParticles();

window.addEventListener("resize", () => {
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
    initParticles();
});
</script>

</body>
</html>
