<!DOCTYPE html> 
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Wayne Tech</title>

<style>

    body {
        margin: 0;
        overflow: hidden;
        background: #0a0a0a;
        font-family: Arial, sans-serif;
    }

    #logo-circle {
        width: 260px;
        height: 260px;
        border-radius: 50%;
        cursor: pointer;

        background-image: url('assets/img/LOGO3.jpeg');
        background-size: cover;
        background-position: center;
        background-repeat: no-repeat;

        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);

        box-shadow: 
            0 0 30px aqua,
            inset 0 0 18px #00ffff80;

        transition: transform 0.35s ease, box-shadow 0.35s ease;
    }

    #logo-circle:hover {
        transform: translate(-50%, -50%) scale(1.10);
        box-shadow: 
            0 0 50px aqua,
            0 0 80px aqua,
            inset 0 0 25px #00ffffc9;
    }

</style>
</head>

<body>

<div id="logo-circle" title="Clique para login"></div>

<script>

const circle = document.getElementById("logo-circle");

circle.addEventListener("click", () => {
    window.location.href = "login.html";  // AGORA ESTÁ CORRETO
});

</script>

</body>
</html>
