<!DOCTYPE html>
<html lang="pt-br" data-bs-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wayne Tech - Agendamentos</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            background: linear-gradient(135deg, #0a0a0a, #1b1b1b);
            color: #f1f1f1;
            padding-top: 70px;
        }

        /* NAVBAR */
        .navbar {
            background: #111 !important;
            backdrop-filter: blur(6px);
            border-bottom: 1px solid #333;
        }
        .navbar-brand {
            font-size: 1.4rem;
            letter-spacing: 1px;
        }

        /* CONTAINER */
        .content-box {
            background: #1c1c1c;
            padding: 30px;
            border-radius: 16px;
            box-shadow: 0 0 20px rgba(0,0,0,0.4);
            border: 1px solid #2d2d2d;
        }

        /* TÍTULO */
        h2.section-title {
            text-align: center;
            margin-bottom: 25px;
            font-size: 1.8rem;
            color: #e0e0e0;
            position: relative;
        }
        h2.section-title::after {
            content: "";
            width: 120px;
            height: 4px;
            background: #0d6efd;
            display: block;
            margin: 10px auto 0 auto;
            border-radius: 4px;
        }

        /* TABELA */
        table {
            border-radius: 12px;
            overflow: hidden;
        }
        thead {
            background: #0d6efd !important;
        }
        thead th {
            color: white !important;
            font-size: 1.05rem;
        }
        tbody tr:hover {
            background-color: #2a2a2a !important;
            cursor: pointer;
        }

        /* FOOTER */
        footer {
            margin-top: 60px;
            padding: 25px 0;
            border-top: 1px solid #333;
            text-align: center;
            color: #888;
        }
    </style>
</head>

<body>

<!-- NAVBAR -->
<nav class="navbar navbar-expand-lg navbar-dark fixed-top shadow-sm">
    <div class="container">
        <a class="navbar-brand fw-bold" href="#">Wayne Tech</a>

        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navMenu">
            <span class="navbar-toggler-icon"></span>
        </button>

        <div class="collapse navbar-collapse" id="navMenu">
            <ul class="navbar-nav me-auto">
                <li class="nav-item"><a class="nav-link active" href="home_adm.html">🏠 Início</a></li>
                <li class="nav-item"><a class="nav-link" href="#">📅 Serviços Agendados</a></li>
            </ul>

            <form class="d-flex" role="search">
                <input class="form-control me-2" type="search" placeholder="Buscar agendamentos...">
                <button class="btn btn-outline-primary">Buscar</button>
            </form>
        </div>
    </div>
</nav>

<!-- CONTEÚDO -->
<div class="container mt-5">
    <div class="content-box">

        <h2 class="section-title">Solicitações de Agendamentos</h2>

        <table class="table table-dark table-hover align-middle mt-3" id="tabela-clientes">
            <thead>
                <tr>
                    <th>Nome</th>
                    <th>E-mail</th>
                    <th>Descrição do Serviço</th>
                    <th>Data da Solicitação</th>
                    <th>Contato</th>
                </tr>
            </thead>
            <tbody>
                <!-- Dados serão inseridos pelo JS -->
            </tbody>
        </table>

    </div>
</div>

<!-- FOOTER -->
<footer>
    © 2025 Wayne Tech — Todos os direitos reservados  
    <br>
    <a href="#" class="text-secondary text-decoration-none">Voltar ao topo</a>
</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script src="script_dados_clientes.js"></script>

</body>
</html>
